name: build
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: repo name
        run: echo "repo name is ${{ github.repository }}"
      - name: branch name
        run: echo "branch name is ${{ github.ref_name }}"
      - name: commit hash
        run: echo "commit hash is ${{ github.sha }}"